<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Canvas File Formatter — Options</title>
  <style>
    /* Set popup width here — increase to make toolbar popup wider */
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial; padding: 16px; width: 480px; box-sizing: border-box; }
    input[type=text] { width: calc(100% - 100px); padding: 6px; margin-right: 8px }
    button { padding: 6px 10px }
    ul { margin-top: 12px }
    li { margin-bottom: 6px }
  </style>
</head>
<body>
  <p>Your Canvas URL (e.g. <em>https://canvas.university.edu</em> or <em>canvas.university.edu</em>)</p>
  <input id="origin" type="text" placeholder="https://canvas.example.edu">
  <button id="add">Add</button>
  <ul id="list"></ul>
  <script src="scripts/options.js"></script>
</body>
</html>
