<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Canvas File Formatter — Options</title>
  <style>
    /* Set popup width here — increase to make toolbar popup wider */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
      font-size: 13px;
      color: #1a1a1a;
      padding: 16px;
      width: 520px;
      box-sizing: border-box;
    }
    p { margin: 0 0 10px }
    .hint { color: #555 }
    .row { display: flex; align-items: center; gap: 8px }
    input[type=text] {
      flex: 1;
      min-width: 0;
      padding: 5px 8px;
      font-size: 13px;
      border: 1px solid #bbb;
      border-radius: 4px;
    }
    button {
      padding: 4px 10px;
      font-size: 12px;
      line-height: 1.4;
      border: 1px solid #bbb;
      border-radius: 4px;
      background: #f6f6f6;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: #ececec }
    #grantRow {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 4px;
      background: #fdf6e6;
      border: 1px solid #e6d5a8;
    }
    #grantRow.ok { background: #f1f8f1; border-color: #cfe3cf }
    #grantMsg { flex: 1 }
    ul { list-style: none; margin: 12px 0 0; padding: 0 }
    li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-bottom: 1px solid #eee;
    }
    li:first-child { border-top: 1px solid #eee }
    .status { width: 12px; text-align: center; font-size: 12px; flex: none }
    .status.ok { color: #2e7d32 }
    .status.warn { color: #b36b00 }
    .origin { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    .empty { color: #777; padding: 6px 0 }
  </style>
</head>
<body>
  <p class="hint">Your Canvas URL (e.g. <em>https://canvas.university.edu</em> or <em>canvas.university.edu</em>)</p>
  <p class="hint">Reload page for changes to take effect.</p>
  <div class="row">
    <input id="origin" type="text" placeholder="https://canvas.example.edu">
    <button id="add">Add</button>
  </div>
  <div class="row" id="grantRow" hidden>
    <span id="grantMsg"></span>
    <button id="grant">Grant access</button>
  </div>
  <ul id="list"></ul>
  <script src="scripts/options.js"></script>
</body>
</html>
